{% extends "base.html" %}

{% block content %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: var(--c-bg); padding: 20px;">
    <div style="max-width: 440px; width: 100%; background: var(--c-surface); border-radius: var(--r-xl); box-shadow: var(--shadow-lg); overflow: hidden; border: 1px solid var(--c-border-light);">
        
        <!-- Header / Logo Area -->
        <div style="padding: 40px 40px 20px 40px; text-align: center;">
            <img src="{{ url_for('static', filename='images/blujay_logo.jpg') }}" alt="BluJay Technologies Logo" style="height: 64px; object-fit: contain; margin: 0 auto 16px auto;">
            <h1 style="font-size: var(--font-size-2xl); font-weight: 700; color: var(--c-text-primary); margin-bottom: 8px;">Create Account</h1>
            <p style="color: var(--c-text-secondary); font-size: var(--font-size-md); margin-bottom: 0;">Register for BluJay Interview Management</p>
        </div>

        <!-- Form Area -->
        <div style="padding: 20px 40px 40px 40px;">
            <form method="POST" action="{{ url_for('main.register') }}">
                <div class="form-group mb-3">
                    <label for="name" class="form-label" style="font-weight: 600; color: var(--c-text-secondary); font-size: var(--font-size-sm);">Full Name</label>
                    <input type="text" id="name" name="name" class="form-control" style="padding: 10px 12px; font-size: var(--font-size-md);" required placeholder="Enter your full name">
                </div>
                
                <div class="form-group mb-3">
                    <label for="email" class="form-label" style="font-weight: 600; color: var(--c-text-secondary); font-size: var(--font-size-sm);">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" style="padding: 10px 12px; font-size: var(--font-size-md);" required placeholder="Enter your email">
                </div>
                
                <div class="form-group mb-3">
                    <label for="password" class="form-label" style="font-weight: 600; color: var(--c-text-secondary); font-size: var(--font-size-sm);">Password</label>
                    <input type="password" id="password" name="password" class="form-control" style="padding: 10px 12px; font-size: var(--font-size-md);" required placeholder="Create a password">
                </div>
                
                <div class="form-group mb-4">
                    <label for="role" class="form-label" style="font-weight: 600; color: var(--c-text-secondary); font-size: var(--font-size-sm);">Role</label>
                    <select id="role" name="role" class="form-select" style="padding: 10px 12px; font-size: var(--font-size-md);" required>
                        <option value="candidate">Candidate</option>
                        <option value="hr">HR Administrator</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary w-100" style="padding: 12px; font-size: var(--font-size-md); font-weight: 600; background-color: var(--c-accent); border-color: var(--c-accent);">
                    Register Account
                </button>
            </form>
            
            <div style="margin-top: 24px; text-align: center;">
                <p style="font-size: var(--font-size-sm); color: var(--c-text-muted);">
                    Already have an account? <a href="{{ url_for('main.login') }}" style="color: var(--c-accent); font-weight: 600;">Sign in here</a>
                </p>
            </div>
        </div>
        
    </div>
</div>
{% endblock %}
