{% extends "base.html" %}

{% block content %}
<div class="standalone-page">
    <div class="form-shell">
        <div class="form-shell-header" style="text-align: center;">
            <div class="auth-brand-name">BluJay Technologies</div>
            <div class="form-shell-title">Create Account</div>
            <div class="form-shell-sub">Register for BluJay Interview Management</div>
        </div>

        <div class="form-shell-body">
            <form method="POST" action="{{ url_for('main.register') }}">
                <div class="form-group">
                    <label for="name">Full Name <span style="color:var(--c-danger);">*</span></label>
                    <input type="text" id="name" name="name" class="form-control" required placeholder="Enter your full name">
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address <span style="color:var(--c-danger);">*</span></label>
                    <input type="email" id="email" name="email" class="form-control" required placeholder="Enter your email">
                </div>
                
                <div class="form-group">
                    <label for="password">Password <span style="color:var(--c-danger);">*</span></label>
                    <input type="password" id="password" name="password" class="form-control" required placeholder="Create a password">
                </div>
                
                <div class="form-group">
                    <label for="role">Role <span style="color:var(--c-danger);">*</span></label>
                    <select id="role" name="role" class="form-select" required>
                        <option value="candidate">Candidate</option>
                        <option value="hr">HR Administrator</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary w-100" style="margin-top:8px;">
                    Register Account
                </button>
            </form>
            
            <p style="margin-top:24px; text-align:center; font-size:12px; color:var(--c-text-secondary);">
                Already have an account? <a href="{{ url_for('main.login') }}">Sign in here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
