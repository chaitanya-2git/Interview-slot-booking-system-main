{% extends "base.html" %}

{% block content %}
<div class="standalone-page">
    <div class="form-shell">
        <div class="form-shell-header" style="text-align:center;">
            <div class="auth-brand-name">BluJay Technologies</div>
            <div class="form-shell-title">Welcome back</div>
            <div class="form-shell-sub">Sign in to your BluJay Interview Management account</div>
        </div>

        <div class="form-shell-body">
            <form method="POST" action="{{ url_for('main.login') }}">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary w-100" style="margin-top:8px;">
                    Sign in to portal
                </button>
            </form>

            <p style="margin-top:24px; text-align:center; font-size:12px; color:var(--c-text-secondary);">
                Don't have an account? <a href="{{ url_for('main.register') }}">Sign up</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
