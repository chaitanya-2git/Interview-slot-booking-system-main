{% extends "base.html" %}
{% block content %}
<div class="standalone-page">
<div class="standalone-page-inner" style="max-width:420px;">
    <div class="form-shell">
        <div class="form-shell-header">
            <div class="form-shell-title">Change Password</div>
            <div class="form-shell-sub">You must set a new password before continuing.</div>
        </div>
        <div class="form-shell-body">
            <form method="POST" action="{{ url_for('main.change_password') }}">
                <div class="form-group">
                    <label for="new_password">New Password <span style="color:var(--c-danger);">*</span></label>
                    <input type="password" id="new_password" name="new_password" class="form-control" required placeholder="Enter new password">
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm Password <span style="color:var(--c-danger);">*</span></label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" required placeholder="Re-enter new password">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;">
                    <i class="bi bi-key"></i> Update Password
                </button>
            </form>
        </div>
    </div>
</div>
</div>
{% endblock %}
