{% extends "base.html" %}
{% block content %}
<div class="standalone-page">
<div class="standalone-page-inner">
    <div style="margin-bottom:16px;">
        <a href="{{ url_for('main.hr_dashboard') }}" class="btn btn-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Back to Dashboard
        </a>
    </div>
    <div class="form-shell">
        <div class="form-shell-header">
            <div class="form-shell-title">Edit Interview Slot</div>
            <div class="form-shell-sub">Update the details for this interview slot.</div>
        </div>
        <div class="form-shell-body">
            <form method="POST" action="{{ url_for('main.edit_slot', slot_id=slot.id) }}">
                <div class="form-group">
                    <label for="license_id">License</label>
                    <select id="license_id" name="license_id" class="form-select" required>
                        {% for license in licenses %}
                        <option value="{{ license.id }}" {% if slot.license_id == license.id %}selected{% endif %}>{{ license.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="interview_date">Interview Date</label>
                    <input type="date" id="interview_date" name="interview_date" class="form-control" value="{{ slot.interview_date }}" required>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                    <div class="form-group">
                        <label for="start_time">Start Time</label>
                        <select id="start_time" name="start_time" class="form-select" required>
                            <option value="">— Select Start —</option>
                            {% for t in ['10:00 AM','10:30 AM','11:00 AM','11:30 AM','12:00 PM','12:30 PM','01:00 PM','01:30 PM','02:00 PM','02:30 PM','03:00 PM','03:30 PM','04:00 PM','04:30 PM','05:00 PM','05:30 PM','06:00 PM','06:30 PM'] %}
                            <option value="{{ t }}" {% if slot.start_time == t %}selected{% endif %}>{{ t }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="end_time">End Time</label>
                        <select id="end_time" name="end_time" class="form-select" required>
                            <option value="">— Select End —</option>
                            {% for t in ['10:30 AM','11:00 AM','11:30 AM','12:00 PM','12:30 PM','01:00 PM','01:30 PM','02:00 PM','02:30 PM','03:00 PM','03:30 PM','04:00 PM','04:30 PM','05:00 PM','05:30 PM','06:00 PM','06:30 PM','07:00 PM'] %}
                            <option value="{{ t }}" {% if slot.end_time == t %}selected{% endif %}>{{ t }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" name="status" class="form-select" required>
                        <option value="available" {% if slot.status == 'available' %}selected{% endif %}>Available</option>
                        <option value="booked" {% if slot.status == 'booked' %}selected{% endif %}>Booked</option>
                        <option value="cancelled" {% if slot.status == 'cancelled' %}selected{% endif %}>Cancelled</option>
                    </select>
                </div>
                <div style="display:flex;gap:12px;margin-top:8px;">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle"></i> Update Slot
                    </button>
                    <a href="{{ url_for('main.hr_dashboard') }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
</div>
{% endblock %}
